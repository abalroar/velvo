name: philips-tv-menubar

on:
  push:
    paths:
      - "philips-tv-menubar/**"
      - ".github/workflows/philips-tv-menubar.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: philips-tv-menubar
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build universal app
        run: bash scripts/build.sh --universal
      - name: Self-check and pairing against simulated TV
        run: bash scripts/integration-test.sh
      - name: Zip app
        run: ditto -c -k --keepParent "dist/PhilipsTV Menubar.app" dist/PhilipsTV-Menubar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhilipsTV-Menubar
          path: philips-tv-menubar/dist/PhilipsTV-Menubar.zip
